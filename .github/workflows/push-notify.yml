name: 새 말씀 알림

# malsseum.json.enc 가 main 에 올라오면(= 새 말씀을 넣으면) 알림을 보낸다.
# Actions 화면에서 손으로 돌리면 시험 알림을 고를 수 있다.
# 같은 편은 두 번 보내지 않으므로 겹쳐 돌아도 괜찮다.
#
# 알림 명단은 성령사연과 하나다(같은 호스트라 같은 출처).
# '받기'는 성령사연 설정에서 누른 것이 그대로 쓰인다.

on:
  push:
    branches: [main]
    paths:
      - 'malsseum.json.enc'
  workflow_dispatch:
    inputs:
      test:
        description: '시험 알림만 보내기'
        type: boolean
        default: true

env:
  SAYEON_PASS: ${{ secrets.SAYEON_PASS }}
  VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
  PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}

concurrency:
  group: push-notify
  cancel-in-progress: false

jobs:
  notify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 준비
        run: python -m pip install --disable-pip-version-check pywebpush==2.5.0   # cryptography 47 이상을 함께 설치한다

      - name: 알림 보내기
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test }}" = "true" ]; then
            python tools/send_push.py --test
          else
            python tools/send_push.py
          fi
