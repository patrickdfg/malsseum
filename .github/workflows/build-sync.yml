name: 말씀 문단 시간표 만들기

# 재생에 맞춰 문단을 짚어 주는 audio/sync.json 을 만든다.
# 시간표가 없는 편은 소리는 나는데 화면이 안 따라간다.
# 녹음을 새로 넣은 뒤 Actions 에서 돌린다. 이미 만든 편은 건너뛴다.
#
# Whisper 로 받아쓰는 일이라 오래 걸린다(base 모델로 대략 7~9배속,
# 40분짜리 한 편에 5분쯤). 편 수가 많으면 나눠 돌린다.

on:
  workflow_dispatch:
    inputs:
      numbers:
        description: '만들 편 번호(공백으로 구분). 비우면 시간표 없는 편 전부'
        required: false
        default: ''
      model:
        description: 'Whisper 모델 (base 가 기본, small 은 더 정확하고 느리다)'
        required: false
        default: 'base'

permissions:
  contents: write
  pages: write

env:
  SAYEON_PASS: ${{ secrets.SAYEON_PASS }}

concurrency:
  group: build-sync-main
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 받아쓰기 도구 설치
        run: python -m pip install --disable-pip-version-check faster-whisper==1.2.1 cryptography==46.0.3

      - name: 문단 시간표 만들기
        run: python tools/build_sync.py --model "${{ inputs.model }}" ${{ inputs.numbers }}

      - name: 결과를 main 에 저장
        run: |
          git config user.name "sayeon-publisher[bot]"
          git config user.email "sayeon-publisher[bot]@users.noreply.github.com"
          git add audio/sync.json
          if git diff --cached --quiet; then
            echo "새로 만든 시간표가 없습니다."
            exit 0
          fi
          python -m json.tool audio/sync.json >/dev/null
          git commit -m "말씀 문단 시간표 생성"
          git pull --rebase origin main
          git push origin main

      - name: GitHub Pages 다시 배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --retry 3 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
