name: 말씀 현수 TTS 생성

# 음성이 없는 말씀 편을 현수 목소리(Edge TTS)로 만들어 붙인다.
# malsseum-tts-request.json 을 올리거나 Actions 에서 직접 돌린다.
# 한 편 끝날 때마다 바로 저장되므로, 중간에 멈춰도 만든 편은 남고
# 다시 돌리면 남은 편부터 이어서 만든다.

on:
  workflow_dispatch:
    inputs:
      numbers:
        description: '만들 편 번호(공백으로 구분). 비우면 음성 없는 편 전부'
        required: false
        default: ''
  push:
    paths:
      - 'malsseum-tts-request.json'

permissions:
  contents: write
  pages: write

env:
  SAYEON_PASS: ${{ secrets.SAYEON_PASS }}

concurrency:
  group: malsseum-tts-main
  cancel-in-progress: false

jobs:
  create:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 음성 도구 설치
        run: python -m pip install --disable-pip-version-check edge-tts==7.2.7 cryptography==46.0.3

      - name: 만들 편 정하기
        id: plan
        run: |
          NUMBERS="${{ github.event.inputs.numbers }}"
          if [ -z "$NUMBERS" ] && [ -f malsseum-tts-request.json ]; then
            NUMBERS=$(python -c "import json;d=json.load(open('malsseum-tts-request.json'));print(' '.join(map(str, d.get('numbers', []))) if d.get('numbers') else '--all')")
          fi
          [ -z "$NUMBERS" ] && NUMBERS="--all"
          echo "numbers=$NUMBERS" >> "$GITHUB_OUTPUT"
          echo "만들 대상: $NUMBERS"

      - name: 현수 목소리로 음성 만들기
        continue-on-error: true
        run: |
          for try in 1 2 3; do
            if python tools/make_malsseum_tts.py ${{ steps.plan.outputs.numbers }}; then
              exit 0
            fi
            echo "::warning::중간에 멈췄습니다. 만든 편은 건너뛰고 다시 시도합니다 ($try/3)"
            sleep 30
          done
          echo "::warning::세 번 시도해도 끝내지 못했습니다. 만들어 둔 편까지만 저장합니다."
          exit 1

      - name: 결과를 main 에 저장
        if: always()
        run: |
          rm -f malsseum-tts-request.json
          git config user.name "sayeon-publisher[bot]"
          git config user.email "sayeon-publisher[bot]@users.noreply.github.com"
          git add -A malsseum.json.enc audio malsseum-tts-request.json
          if git diff --cached --quiet; then
            echo "새로 만든 음성이 없습니다."
            exit 0
          fi
          python -c "import sys,os;sys.path.insert(0,'tools');import crypt;print(len(crypt.read_json('malsseum.json')))"
          python -m json.tool audio/sync.json >/dev/null
          test -z "$(find audio -type f -size +99M -print -quit)"
          LEFT=$(python -c "import sys,os;sys.path.insert(0,'tools');import crypt;print(sum(1 for e in crypt.read_json('malsseum.json') if not e.get('audio')))")
          git commit -m "말씀 현수 TTS 생성 (남은 편 ${LEFT})"
          git pull --rebase origin main
          git push origin main

      - name: GitHub Pages 다시 배포
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --retry 3 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: 남은 편 알림
        if: always()
        run: |
          python - <<'PY'
          import sys, os
          sys.path.insert(0, 'tools')
          import crypt
          data = crypt.read_json('malsseum.json')
          left = [e['no'] for e in data if not e.get('audio')]
          print('아직 음성 없는 말씀 %d편: %s' % (len(left), left))
          PY
